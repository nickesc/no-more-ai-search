name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - name: Validate extension
        run: npx --yes web-ext@10.8.0 lint --warnings-as-errors --ignore-files 'tests/**' 'docs/**' 'design/**' 'scripts/**' 'dist/**' 'src/userscript.js'
